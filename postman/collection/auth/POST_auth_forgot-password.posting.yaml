name: "POST /auth/forgot-password"
description: Returns a 200 with identical shape whether or not the email is registered
  (no enumeration). In dev mode, the response also includes `dev_reset_token` so the
  frontend can drive the flow without SMTP.
method: POST
url: ${BASE_URL}/auth/forgot-password
body:
  content: |-
    {
      "email": ""
    }
