name: Create a new account and log in
description: 'Creates the user, hashes the password with bcrypt, opens a session,
  and sets the `klar_session` HttpOnly cookie on the response. The frontend should
  send subsequent requests with `credentials: ''include''`.'
method: POST
url: ${BASE_URL}/auth/signup
body:
  content: |-
    {
      "email": "",
      "password": "",
      "language": "en"
    }
