<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<style>
  .wrap {
    position: absolute;
    inset: 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 10;
  }
  .words {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .word-row {
    font-family: var(--display);
    font-weight: 700;
    font-size: 126px;
    line-height: 1.08;
    letter-spacing: -0.005em;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
  }
  .word-row .idx {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 28px;
    color: var(--ink-soft);
    width: 70px;
    text-align: right;
  }
  .word-row .spacer { width: 70px; }
  .sub {
    margin-top: 70px;
    font-family: var(--mono);
    font-size: 28px;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
  }
  .sub b { color: var(--ink); }
  .wrap .stamp {
    margin-top: 66px;
    font-size: 30px;
    background: var(--bg);
  }
  .kicker-top {
    position: absolute;
    top: 84px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 10;
  }
</style>
</head>
<body>
  <div class="frame"></div>

  <div class="kicker-top kicker">Klar · bureaucracy survival agent</div>

  <div class="wrap">
    <div class="words">
      <div class="word-row"><span class="idx">01</span><span>UPLOAD.</span><span class="spacer"></span></div>
      <div class="word-row"><span class="idx">02</span><span>UNDERSTAND.</span><span class="spacer"></span></div>
      <div class="word-row"><span class="idx">03</span><span class="hl">ACT.</span><span class="spacer"></span></div>
    </div>

    <div class="sub">Photograph the letter. Get the deadline, the law, <b>and the response</b> — in your language.</div>

    <div class="stamp">
      <span class="word">KLAR</span>
      <span class="bar"></span>
    </div>
  </div>

  <div class="footer">
    <span>NO MORE €150 TRANSLATIONS</span>
    <span>04 / 04</span>
  </div>
</body>
</html>
